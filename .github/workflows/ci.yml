name: Testes automatizados

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: API, frontend e Playwright
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: sqa_social_media
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Baixar codigo da PR
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: |
            client/package-lock.json
            tests/package-lock.json

      - name: Instalar dependencias do frontend
        working-directory: client
        run: npm ci

      - name: Instalar dependencias dos testes
        working-directory: tests
        run: npm ci

      - name: Instalar Chromium do Playwright
        working-directory: tests
        run: npx playwright install --with-deps chromium

      - name: Iniciar API Spring Boot
        working-directory: api
        run: |
          chmod +x mvnw
          ./mvnw spring-boot:run > ../api.log 2>&1 &

      - name: Iniciar frontend Next.js
        working-directory: client
        env:
          NEXT_PUBLIC_BASE_URL: http://localhost:8080
        run: npm run dev > ../client.log 2>&1 &

      - name: Aguardar servicos ficarem disponiveis
        run: |
          for port in 8080 3000; do
            for attempt in {1..30}; do
              if curl --silent "http://localhost:${port}" > /dev/null; then
                break
              fi
              if [ "$attempt" -eq 30 ]; then
                echo "Servico na porta ${port} nao iniciou"
                exit 1
              fi
              sleep 2
            done
          done

      - name: Executar testes Playwright
        working-directory: tests
        run: npm test

      - name: Exibir logs em caso de falha
        if: failure()
        run: |
          cat api.log || true
          cat client.log || true
